<app-header />
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user
          [user]="user"
          [selected]="selectedUserId() === user.id"
          (userSelected)="selectUser(user.id)"
        />
      </li>
    }
  </ul>

  <section id="fallback">
    <h2>{{ selectedUser().name }}</h2>
    <p>{{ selectedUser().role }}</p>
  </section>
</main>
<router-outlet />
